name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish StarkTrace.Api
        run: |
          dotnet publish src/StarkTrace.Api/StarkTrace.Api.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish/api

      - name: Publish StarkTrace.Mcp
        run: |
          dotnet publish src/StarkTrace.Mcp/StarkTrace.Mcp.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish/mcp

      - name: Publish StarkTrace.Proxy
        run: |
          dotnet publish src/StarkTrace.Proxy/StarkTrace.Proxy.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish/proxy

      - name: Publish StarkTrace.Dashboard
        run: |
          dotnet publish src/StarkTrace.Dashboard/StarkTrace.Dashboard.csproj `
            -c Release `
            -o publish/dashboard

      - name: Zip artifacts
        run: |
          Compress-Archive -Path publish/api/*       -DestinationPath publish/StarkTrace.Api-win-x64.zip
          Compress-Archive -Path publish/mcp/*       -DestinationPath publish/StarkTrace.Mcp-win-x64.zip
          Compress-Archive -Path publish/proxy/*     -DestinationPath publish/StarkTrace.Proxy-win-x64.zip
          Compress-Archive -Path publish/dashboard/* -DestinationPath publish/StarkTrace.Dashboard.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: StarkTrace ${{ github.ref_name }}
          body: |
            ## Install

            **One-line installer (PowerShell):**
            ```powershell
            irm https://raw.githubusercontent.com/jstarkwv/StarkTrace/main/install.ps1 | iex
            ```

            **Requirements:** [Ollama](https://ollama.com) + .NET 8 (auto-installed if missing)

            ## What's included
            - `StarkTrace.Api-win-x64.zip` — API server (self-contained, no .NET install needed)
            - `StarkTrace.Mcp-win-x64.zip` — MCP stdio server for Claude Desktop
            - `StarkTrace.Proxy-win-x64.zip` — MCP audit proxy
            - `StarkTrace.Dashboard.zip` — Blazor WASM dashboard (static files)

            ## Manual install
            See [README](https://github.com/jstarkwv/StarkTrace/blob/main/README.md) for manual setup instructions.
          files: |
            publish/StarkTrace.Api-win-x64.zip
            publish/StarkTrace.Mcp-win-x64.zip
            publish/StarkTrace.Proxy-win-x64.zip
            publish/StarkTrace.Dashboard.zip
          draft: false
          prerelease: false
