services:
  # ── SQL Server 2025 ──────────────────────────────────────────────
  apex-sql-server:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: apex-sql-server
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:-Apex_Dev_2026!}"
      TZ: "America/New_York"
    ports:
      - "127.0.0.1:1444:1433"
    volumes:
      - apex-sql-data:/var/opt/mssql
    networks:
      - apex-internal
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${SA_PASSWORD:-Apex_Dev_2026!}" -Q "SELECT 1" -C -b
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ── Redis 7 (task queue + session cache) ─────────────────────────
  apex-redis:
    image: redis:7-alpine
    container_name: apex-redis
    environment:
      TZ: "America/New_York"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - apex-redis-data:/data
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-apex-dev-redis}"
    networks:
      - apex-internal
    healthcheck:
      test: redis-cli -a "${REDIS_PASSWORD:-apex-dev-redis}" ping | grep PONG
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Ollama (local embeddings + summarization) ────────────────────
  apex-ollama:
    image: ollama/ollama:latest
    container_name: apex-ollama
    environment:
      TZ: "America/New_York"
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - apex-ollama-data:/root/.ollama
    networks:
      - apex-internal
    healthcheck:
      test: curl -f http://localhost:11434/api/tags || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Presidio Analyzer (PII detection sidecar) ───────────────────
  apex-presidio:
    image: mcr.microsoft.com/presidio-analyzer:latest
    container_name: apex-presidio
    environment:
      TZ: "America/New_York"
    # No port mapping — only accessible on internal network
    # API reaches it at http://apex-presidio:3000
    networks:
      - apex-internal
    healthcheck:
      test: curl -f http://localhost:3000/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── APEX .NET 8 API ──────────────────────────────────────────────
  apex-api:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    container_name: apex-api
    ports:
      - "127.0.0.1:5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__ApexDb: "Server=apex-sql-server;Database=ApexDb;User Id=sa;Password=${SA_PASSWORD:-Apex_Dev_2026!};TrustServerCertificate=true;"
      Apex__Redis__Connection: "apex-redis:6379,password=${REDIS_PASSWORD:-apex-dev-redis}"
      Apex__Ollama__BaseUrl: "http://host.docker.internal:11434"
      Apex__Presidio__BaseUrl: "http://apex-presidio:3000"
      Apex__AgencyGate__MinSuggestions: "${AGENCY_MIN_SUGGESTIONS:-30}"
      Apex__AgencyGate__MinFeedbackRate: "${AGENCY_MIN_FEEDBACK_RATE:-0.40}"
      Apex__AgencyGate__MinAntiPatternSuppressions: "${AGENCY_MIN_SUPPRESSIONS:-1}"
      Apex__AgencyGate__MinConsolidatedSessions: "${AGENCY_MIN_CONSOLIDATED:-5}"
      TZ: "America/New_York"
    networks:
      - apex-internal
      - apex-external
    depends_on:
      apex-sql-server:
        condition: service_healthy
      apex-redis:
        condition: service_healthy
    restart: unless-stopped

networks:
  apex-internal:
    driver: bridge
    # All ports bound to 127.0.0.1 — not reachable externally
  apex-external:
    driver: bridge

volumes:
  apex-sql-data:
  apex-redis-data:
  apex-ollama-data:
