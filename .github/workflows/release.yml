name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Apex.Api
        run: |
          dotnet publish src/Apex.Api/Apex.Api.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish/api

      - name: Publish Apex.Mcp
        run: |
          dotnet publish src/Apex.Mcp/Apex.Mcp.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish/mcp

      - name: Publish Apex.Proxy
        run: |
          dotnet publish src/Apex.Proxy/Apex.Proxy.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish/proxy

      - name: Publish Apex.Dashboard
        run: |
          dotnet publish src/Apex.Dashboard/Apex.Dashboard.csproj `
            -c Release `
            -o publish/dashboard

      - name: Zip artifacts
        run: |
          Compress-Archive -Path publish/api/*       -DestinationPath publish/Apex.Api-win-x64.zip
          Compress-Archive -Path publish/mcp/*       -DestinationPath publish/Apex.Mcp-win-x64.zip
          Compress-Archive -Path publish/proxy/*     -DestinationPath publish/Apex.Proxy-win-x64.zip
          Compress-Archive -Path publish/dashboard/* -DestinationPath publish/Apex.Dashboard.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: APEX ${{ github.ref_name }}
          body: |
            ## Install

            **One-line installer (PowerShell):**
            ```powershell
            irm https://raw.githubusercontent.com/jstarkwv/APEX/feature/no-docker/install.ps1 | iex
            ```

            **Requirements:** [Ollama](https://ollama.com) + .NET 8 (auto-installed if missing)

            ## What's included
            - `Apex.Api-win-x64.zip` — API server (self-contained, no .NET install needed)
            - `Apex.Mcp-win-x64.zip` — MCP stdio server for Claude Desktop
            - `Apex.Proxy-win-x64.zip` — MCP audit proxy
            - `Apex.Dashboard.zip` — Blazor WASM dashboard (static files)

            ## Manual install
            See [README](https://github.com/jstarkwv/APEX/blob/feature/no-docker/README.md) for manual setup instructions.
          files: |
            publish/Apex.Api-win-x64.zip
            publish/Apex.Mcp-win-x64.zip
            publish/Apex.Proxy-win-x64.zip
            publish/Apex.Dashboard.zip
          draft: false
          prerelease: false
